<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Game</title>
    <link rel="stylesheet" href="css/dashboard_game.css">
</head>
<body>
    <div class="dashboard-container">
      <!--Kartu Karakter 1-->
      <div class="character-card">
        <img src="image/space.jpg" alt="Hero 1" class="char-img">
        <div class="char-info">
          <h3 class="char-name">Nama Hero</h3>
          <div class="char-stat">
            <p>Tipe serangan :<span>Jarak dekat</span></p>
            <p>Damage :<span>150</span></p>    
          </div>
        </div>
      </div>
      <!--Kartu Karakter 1 end-->
      <!--Kartu Karakter 2-->
      <div class="character-card">
        <img src="image/space2.jpg" alt="Hero 2" class="char-img">
        <div class="char-info">
          <h3 class="char-name">Nama Hero</h3>
          <div class="char-stat">
            <p>Tipe serangan <span>Jarak jauh</span></p>
            <p>Damage :<span>200</span></p>    
          </div>
        </div>
      </div>
      <!--Kartu Karakter 2 end-->
    </div>
<!--Deskripsi Karakter-->
    <div class="chardesc-container">
      <div class="chardesc">
      <p>ini deskripsi karakter </p>
      
       </div> 
      
    </div>





</body>
</html>
